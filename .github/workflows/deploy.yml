name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/wizardly-pascal-d5dx7s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_REPO: ${{ github.repository }}
          VITE_APP_BRANCH: ${{ github.ref_name }}
      # Desktopová aplikace pro Windows — jeden .exe ke stažení z webu.
      - name: Build Windows app
        working-directory: desktop
        run: |
          npm ci
          npm run build:win
          cp release/ProjectTwoCRM.exe ../dist/ProjectTwoCRM.exe
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Zveřejnění je samostatný job: balík z buildu je v tu chvíli už finalizovaný.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
